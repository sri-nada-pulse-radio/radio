<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Nada City Pulse Radio - Live Stream</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .player-card {
            background: #1e293b;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        .logo-area {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px auto;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 12px;
        }
        .live-badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .live-dot {
            height: 8px;
            width: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .play-btn {
            width: 100%;
            padding: 14px 25px;
            background: linear-gradient(135deg, #6c5ce7, #8e44ad);
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
            cursor: pointer;
            transition: 0.3s;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .social-btn {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 15px;
            border: 1px solid #334155;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="player-card">
    <div class="logo-area">🎙️</div>
    <div class="title">Sri Nada City Pulse Radio</div>
    <div class="subtitle">Music & Entertainment</div>
    <div class="live-badge">
        <span class="live-dot"></span> LIVE
    </div>

    <!-- HTML5 Native Audio Control Button -->
    <button id="mainPlayBtn" class="play-btn" onclick="toggleAudio()">▶️ PLAY RADIO</button>
    
    <audio id="radioStream" preload="none">
        <source src="https://s1.free-shoutcast.com:18128/;" type="audio/mpeg">
    </audio>

    <div class="social-links">
        <a href="#" class="social-btn" target="_blank">Facebook</a>
        <a href="#" class="social-btn" target="_blank">WhatsApp</a>
    </div>
</div>

<script>
    var audio = document.getElementById("radioStream");
    var btn = document.getElementById("mainPlayBtn");
    var isPlaying = false;

    function toggleAudio() {
        if (!isPlaying) {
            btn.innerHTML = "⏳ LOADING...";
            audio.load();
            audio.play().then(function() {
                btn.innerHTML = "⏸️ PAUSE";
                btn.style.background = "#ff4757";
                isPlaying = true;
            }).catch(function(error) {
                alert("Playback block වුණා. කරුණාකර නැවත ඔබන්න.");
                btn.innerHTML = "▶️ PLAY RADIO";
                isPlaying = false;
            });
        } else {
            audio.pause();
            audio.currentTime = 0;
            btn.innerHTML = "▶️ PLAY RADIO";
            btn.style.background = "linear-gradient(135deg, #6c5ce7, #8e44ad)";
            isPlaying = false;
        }
    }
</script>

</body>
</html>
