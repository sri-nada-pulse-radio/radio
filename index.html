<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Pulse Radio - Live</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .player-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 360px;
            width: 90%;
        }
        .logo-img {
            width: 100%;
            max-width: 280px;
            height: auto;
            margin-bottom: 10px;
            border-radius: 12px;
        }
        .live-badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .live-dot {
            height: 8px;
            width: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .player-wrapper {
            width: 100%;
            height: 140px;
            overflow: hidden;
            border-radius: 15px;
            background: #0f172a;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .player-wrapper iframe {
            width: 100%;
            height: 350px;
            border: none;
            margin-top: -110px;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .social-btn {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 15px;
            border: 1px solid #334155;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="player-card">
    <!-- Updated Official Logo -->
    <img src="https://i.ibb.co/LzdS8mH/170760.png" alt="City Pulse Radio Logo" class="logo-img">
    
    <div class="live-badge">
        <span class="live-dot"></span> LIVE BROADCAST
    </div>

    <!-- Embedded Clean Player -->
    <div class="player-wrapper">
        <iframe src="https://radio.free-shoutcast.com/site/91252" scrolling="no"></iframe>
    </div>

    <div class="social-links">
        <a href="#" class="social-btn" target="_blank">Facebook</a>
        <a href="#" class="social-btn" target="_blank">WhatsApp</a>
    </div>
</div>

</body>
</html>
