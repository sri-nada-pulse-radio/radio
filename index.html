<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>City Pulse Radio - Live</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at top, #3b0a0a 0%, #111827 45%, #050505 100%);

            color: white;
        }

        .player-card {
            width: 100%;
            max-width: 390px;

            padding: 25px 20px 22px;

            background: rgba(20, 20, 25, 0.95);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.65),
                0 0 35px rgba(220, 0, 0, 0.12);

            text-align: center;
        }

        /* LOGO */

        .logo-img {
            display: block;

            width: 100%;
            max-width: 285px;

            height: auto;

            margin: 0 auto 18px;

            border-radius: 15px;
        }

        /* LIVE BADGE */

        .live-badge {
            display: inline-flex;
            align-items: center;

            padding: 7px 15px;

            margin-bottom: 18px;

            border-radius: 30px;

            background: rgba(255, 0, 0, 0.12);

            border: 1px solid rgba(255, 50, 50, 0.25);

            color: #ff3b3b;

            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .live-dot {
            width: 9px;
            height: 9px;

            margin-right: 7px;

            background: #ff2222;

            border-radius: 50%;

            box-shadow: 0 0 12px #ff2222;

            animation: pulse 1.3s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.45;
                transform: scale(0.75);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* RADIO TITLE */

        .radio-title {
            font-size: 24px;
            font-weight: 800;

            letter-spacing: 1px;

            margin-bottom: 5px;
        }

        .radio-subtitle {
            font-size: 13px;

            color: #9ca3af;

            margin-bottom: 22px;
        }

        /* PLAYER */

        .player-box {
            padding: 18px;

            border-radius: 18px;

            background: linear-gradient(
                145deg,
                #252525,
                #111111
            );

            border: 1px solid rgba(255,255,255,0.08);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .play-button {
            width: 75px;
            height: 75px;

            border: none;

            border-radius: 50%;

            background: linear-gradient(
                145deg,
                #ff3333,
                #b30000
            );

            color: white;

            font-size: 27px;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(255, 0, 0, 0.35);

            transition: 0.2s ease;
        }

        .play-button:hover {
            transform: scale(1.06);

            box-shadow:
                0 10px 30px rgba(255, 0, 0, 0.5);
        }

        .play-button:active {
            transform: scale(0.96);
        }

        .status {
            margin-top: 14px;

            font-size: 13px;

            color: #9ca3af;
        }

        .status.playing {
            color: #ff4444;
        }

        /* VOLUME */

        .volume-area {
            display: flex;
            align-items: center;

            gap: 10px;

            margin-top: 18px;
        }

        .volume-icon {
            font-size: 18px;
        }

        #volume {
            width: 100%;

            accent-color: #e00000;

            cursor: pointer;
        }

        /* SOCIAL */

        .social-links {
            display: flex;

            justify-content: center;

            gap: 10px;

            margin-top: 20px;
        }

        .social-btn {
            flex: 1;

            max-width: 130px;

            padding: 10px 12px;

            color: #d1d5db;

            text-decoration: none;

            font-size: 13px;

            border: 1px solid #333;

            border-radius: 10px;

            background: rgba(255,255,255,0.03);

            transition: 0.2s;
        }

        .social-btn:hover {
            background: rgba(255,255,255,0.08);

            color: white;
        }

        /* FOOTER */

        .footer {
            margin-top: 18px;

            font-size: 11px;

            color: #6b7280;
        }

        /* MOBILE */

        @media (max-width: 420px) {

            body {
                padding: 12px;
            }

            .player-card {
                padding: 22px 16px;
            }

            .radio-title {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="player-card">

    <!-- LOGO -->
    <img
        src="logo.jpeg"
        alt="City Pulse Radio"
        class="logo-img"
    >

    <!-- LIVE -->
    <div class="live-badge">
        <span class="live-dot"></span>
        LIVE BROADCAST
    </div>

    <!-- TITLE -->
    <div class="radio-title">
        CITY PULSE RADIO
    </div>

    <div class="radio-subtitle">
        Your Music • Your Pulse • Your Radio
    </div>

    <!-- PLAYER -->
    <div class="player-box">

        <button
            id="playButton"
            class="play-button"
            aria-label="Play Radio"
        >
            ▶️
        </button>

        <div
            id="status"
            class="status"
        >
            Tap Play to listen live
        </div>

        <!-- VOLUME -->
        <div class="volume-area">

            <span class="volume-icon">🔊</span>

            <input
                id="volume"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.8"
            >

        </div>

    </div>

    <!-- SOCIAL LINKS -->
   <div class="social-links">

    <a
        href="https://www.facebook.com/profile.php?id=100076111430930&sk=about"
        class="social-btn"
        target="_blank"
        rel="noopener noreferrer"
    >
        Facebook
    </a>

    <a
        href="https://wa.me/94712836699"
        class="social-btn"
        target="_blank"
        rel="noopener noreferrer"
    >
        WhatsApp
    </a>

</div>

    <div class="footer">
        City Pulse Radio • Live Online
    </div>

</div>


<!-- AUDIO STREAM -->

<audio
    id="radio"
    preload="none"
    playsinline
>
    <source
        src="https://s1.free-shoutcast.com/stream/18114"
        type="audio/mpeg"
    >
</audio>


<script>

    const radio = document.getElementById("radio");

    const playButton = document.getElementById("playButton");

    const status = document.getElementById("status");

    const volume = document.getElementById("volume");


    /* DEFAULT VOLUME */

    radio.volume = 0.8;


    /* PLAY / PAUSE */

    playButton.addEventListener("click", function () {

        if (radio.paused) {

            status.textContent = "Connecting to City Pulse Radio...";

            radio.play()
                .then(function () {

                    playButton.innerHTML = "❚❚";

                    status.textContent = "● LIVE - Now Playing";

                    status.classList.add("playing");

                })
                .catch(function (error) {

                    console.log(error);

                    status.textContent =
                        "Unable to connect. Please try again.";

                    status.classList.remove("playing");

                });

        } else {

            radio.pause();

            playButton.innerHTML = "▶️";

            status.textContent = "Radio paused";

            status.classList.remove("playing");
        }

    });


    /* VOLUME */

    volume.addEventListener("input", function () {

        radio.volume = this.value;

    });


    /* WHEN PLAYING */

    radio.addEventListener("playing", function () {

        playButton.innerHTML = "❚❚";

        status.textContent = "● LIVE - Now Playing";

        status.classList.add("playing");

    });


    /* WHEN PAUSED */

    radio.addEventListener("pause", function () {

        playButton.innerHTML = "▶️";

        status.textContent = "Radio paused";

        status.classList.remove("playing");

    });


    /* ERROR */

    radio.addEventListener("error", function () {

        playButton.innerHTML = "▶️";

        status.textContent =
            "Stream connection error. Please try again.";

        status.classList.remove("playing");

    });


    /* WAITING */

    radio.addEventListener("waiting", function () {

        status.textContent =
            "Connecting to live stream...";

    });

</script>

</body>
</html>
