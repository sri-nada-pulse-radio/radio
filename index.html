<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Pulse Radio - Live</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .player-card {
            background: #1e293b;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 360px;
            width: 90%;
        }
        .logo-img {
            width: 100%;
            max-width: 280px;
            height: auto;
            margin: 0 auto 15px auto;
            display: block;
            border-radius: 12px;
        }
        .live-badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .live-dot {
            height: 8px;
            width: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }

        /* Custom Play Button Section */
        .custom-player-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px 15px;
            margin-bottom: 20px;
        }
        .play-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }
        .play-btn:active {
            transform: scale(0.96);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .social-btn {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 15px;
            border: 1px solid #334155;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="player-card">
    <img src="logo.jpeg" alt="City Pulse Radio Logo" class="logo-img">
    
    <div class="live-badge">
        <span class="live-dot"></span> LIVE BROADCAST
    </div>

    <!-- Direct Clean Play Button -->
    <div class="custom-player-box">
        <button class="play-btn" id="radioPlayBtn" onclick="togglePlay()">
            <span id="btnIcon">▶️</span> <span id="btnText">PLAY LIVE</span>
        </button>
        <audio id="radioStream" src="https://radio.free-shoutcast.com/stream/91252"></audio>
    </div>

    <div class="social-links">
        <a href="#" class="social-btn" target="_blank">Facebook</a>
        <a href="#" class="social-btn" target="_blank">WhatsApp</a>
    </div>
</div>

<script>
    const audio = document.getElementById('radioStream');
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');

    function togglePlay() {
        if (audio.paused) {
            audio.play().then(() => {
                btnIcon.innerText = "⏸️";
                btnText.innerText = "PAUSE";
            }).catch(err => {
                alert("Playback error. Please try again.");
            });
        } else {
            audio.pause();
            btnIcon.innerText = "▶️";
            btnText.innerText = "PLAY LIVE";
        }
    }
</script>

</body>
</html>
