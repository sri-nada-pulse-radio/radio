<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Nada City Pulse Radio - Live Stream</title>
    <!-- Howler.js for robust audio playback -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .player-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        .logo-area {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .live-badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .live-dot {
            height: 8px;
            width: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .play-btn {
            padding: 14px 35px;
            font-size: 16px;
            border-radius: 30px;
            border: none;
            background: #6c5ce7;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
            width: 80%;
            transition: 0.3s;
        }
        .social-links {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .social-btn {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 15px;
            border: 1px solid #334155;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="player-card">
    <div class="logo-area">🎙️</div>
    <div class="title">Sri Nada City Pulse Radio</div>
    <div class="subtitle">Music & Entertainment</div>
    <div class="live-badge">
        <span class="live-dot"></span> LIVE
    </div>

    <!-- Play Button -->
    <button id="playBtn" class="play-btn" onclick="togglePlay()">▶️ PLAY RADIO</button>

    <div class="social-links">
        <a href="#" class="social-btn" target="_blank">Facebook</a>
        <a href="#" class="social-btn" target="_blank">WhatsApp</a>
    </div>
</div>

<script>
    var sound = null;
    var isPlaying = false;

    function togglePlay() {
        var btn = document.getElementById("playBtn");

        if (!isPlaying) {
            btn.innerHTML = "⏳ LOADING...";
            sound = new Howl({
                src: ['https://s3.free-shoutcast.com/stream/18128'],
                html5: true,
                format: ['mp3'],
                onplay: function() {
                    btn.innerHTML = "⏸️ PAUSE";
                    btn.style.background = "#ff4757";
                    isPlaying = true;
                },
                onloaderror: function(id, err) {
                    alert("Stream එක Load කරගැනීමට නොහැකි විය: " + err);
                    btn.innerHTML = "▶️ PLAY RADIO";
                    isPlaying = false;
                },
                onplayerror: function(id, err) {
                    alert("Playback Error: " + err);
                    btn.innerHTML = "▶️ PLAY RADIO";
                    isPlaying = false;
                }
            });
            sound.play();
        } else {
            if (sound) {
                sound.unload(); // Stops buffering & completely releases audio stream
            }
            btn.innerHTML = "▶️ PLAY RADIO";
            btn.style.background = "#6c5ce7";
            isPlaying = false;
        }
    }
</script>

</body>
</html>
