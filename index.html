<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Nada City Pulse Radio - Live Stream</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .player-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .logo-area {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px auto;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .live-badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .live-dot {
            height: 8px;
            width: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .stream-frame {
            border: none;
            width: 100%;
            height: 380px;
            border-radius: 15px;
            background: #ffffff;
        }
        .social-links {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .social-btn {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 15px;
            border: 1px solid #334155;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="player-card">
    <div class="logo-area">🎙️</div>
    <div class="title">Sri Nada City Pulse Radio</div>
    <div class="subtitle">Music & Entertainment</div>
    <div class="live-badge">
        <span class="live-dot"></span> LIVE
    </div>

    <!-- Official Embedded Player -->
    <iframe class="stream-frame" src="https://radio.free-shoutcast.com/site/91252"></iframe>

    <div class="social-links">
        <a href="#" class="social-btn" target="_blank">Facebook</a>
        <a href="#" class="social-btn" target="_blank">WhatsApp</a>
    </div>
</div>

</body>
</html>
